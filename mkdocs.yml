site_name: agentrec
site_url: https://vedansh-adepu.github.io/agentrec/
repo_url: https://github.com/vedansh-adepu/agentrec
strict: true
theme:
  name: material
  font: false
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
exclude_docs: |
  history/
nav:
  - Home: index.md
  - Architecture: architecture.md
  - API: api.md
  - API stability: api-stability.md
  - Matching: matching.md
  - Redaction: redaction.md
  - Cassette format: cassette-format.md
  - Errors: errors.md
  - CI and pytest: ci.md
  - Migration: migration.md
  - Performance: performance.md
  - Test quality: test-quality.md
  - Releasing: releasing.md
  - Decisions:
      - Occurrence queues: adr/0011-per-key-occurrence-queues.md
      - Explicit matching: adr/0012-explicit-json-pointer-matching.md
      - HTTP boundary: adr/0013-http-transport-interception.md
      - Atomic finalize: adr/0014-buffered-atomic-finalize.md
      - Redaction: adr/0015-redaction-before-persist.md
      - Schema: adr/0016-schema-v2.md
  - Historical decisions:
      - "0001 Local CLI, not a dashboard": adr/0001-build-a-local-deterministic-record-replay-cli-not-a-dashboard.md
      - "0002 Offline provider before live integrations": adr/0002-start-with-fake-offline-provider-before-live-openai-anthropic-providers.md
      - "0003 Content-addressed replay lookup": adr/0003-use-content-addressed-request-hashes-for-replay-lookup.md
      - "0004 Meaningful IDs and implicit normalization": adr/0004-preserve-meaningful-id-fields-during-normalization.md
      - "0005 Local filesystem cassettes": adr/0005-use-local-filesystem-cassettes-first.md
      - "0006 Hermetic replay and explicit misses": adr/0006-keep-replay-hermetic-cache-misses-must-fail-loudly.md
      - "0007 Safe calculator AST (retired)": adr/0007-use-safe-ast-parsing-for-calculator-instead-of-eval.md
      - "0008 Incremental development and review": adr/0008-work-one-step-at-a-time-and-inspect-before-moving-forward.md
      - "0009 Production quality without feature bloat": adr/0009-treat-production-level-as-strong-guarantees-tests-docs-and-safety-not-feature-bl.md
      - "0010 Versioned cassette metadata": adr/0010-version-local-cassette-metadata.md
