[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrec"
dynamic = ["version"]
description = "Deterministic record-and-replay harness for AI-agent runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Vedansh Adepu" },
]
dependencies = [
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.21",
]

[project.scripts]
agentrec = "agentrec.cli:app"

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
pytest = ["pytest>=8.0"]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "pytest-socket>=0.7",
  "httpx2>=2.13",
  "openai>=3",
  "anthropic>=1",
  "httpx>=0.27",
]

dev = [
  "ruff>=0.9",
  "mypy>=1.14",
  "pre-commit>=4.0",
  "mutmut>=3.8",
  "uv>=0.8",
  "build>=1.2",
  "mkdocs-material>=9.6",
  "mkdocstrings[python]>=1.0.6",
]

[project.entry-points.pytest11]
agentrec = "agentrec.pytest_plugin"

[project.urls]
Homepage = "https://github.com/vedansh-adepu/agentrec"
Repository = "https://github.com/vedansh-adepu/agentrec"
Issues = "https://github.com/vedansh-adepu/agentrec/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agentrec"]

[tool.coverage.run]
branch = true
source = ["agentrec"]

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/agentrec/canonical.py", "src/agentrec/matching.py", "src/agentrec/cassette/replay.py"]
also_copy = ["docs"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "--disable-socket", "--allow-unix-socket"]
pytest_add_cli_args_test_selection = ["tests/test_canonical_matching.py", "tests/test_replay_index.py", "tests/test_properties.py", "tests/test_mutation_regressions.py", "tests/test_canonical_edges.py"]

[tool.hatch.version]
path = "src/agentrec/__init__.py"
