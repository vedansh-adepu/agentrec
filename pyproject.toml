[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentrec"
version = "0.1.0"
description = "Deterministic record-and-replay harness for AI-agent runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Vedansh Adepu" },
]
dependencies = [
  "pydantic>=2.7",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
agentrec = "agentrec.cli:app"

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "httpx2>=2.13",
  "openai>=3",
  "anthropic>=1",
]

dev = [
  "ruff>=0.9",
  "mypy>=1.14",
  "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/vedansh-adepu/agentrec"
Repository = "https://github.com/vedansh-adepu/agentrec"
Issues = "https://github.com/vedansh-adepu/agentrec/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agentrec"]

[tool.coverage.run]
branch = true
source = ["agentrec"]

[tool.coverage.report]
show_missing = true
